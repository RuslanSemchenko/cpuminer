# CI for cpuminer: build on linux & macos, upload binaries, and provide an ASan+fuzzer build
# - Builds with gcc and clang on linux and macos
# - Produces artifacts for each job
# - Provides an ASan+libFuzzer-friendly build for fuzzing
# Adjust package lists and configure/make steps to match this repository's build system (autotools/Makefile/CMake).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUILD_OUTPUT_DIR: release-artifacts

jobs:
  build-matrix:
    name: Build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install automake autoconf libtool pkg-config openssl@3 libev

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          # Install common build deps; add/remove as required for this repo
          sudo apt-get install -y build-essential automake autoconf libtool pkg-config \
            libssl-dev libcurl4-openssl-dev libjansson-dev libgmp-dev
          # Some projects require nasm for assembly
          sudo apt-get install -y nasm

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            if [ "$(uname -s)" = "Linux" ]; then
              sudo apt-get install -y clang || true
            fi
            export CC=clang
            export CXX=clang++
          else
            export CC=gcc
            export CXX=g++
          fi
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV

      - name: Prepare build (autotools / configure)
        run: |
          set -euo pipefail
          # If project uses autotools
          if [ -f autogen.sh ]; then
            chmod +x autogen.sh
            ./autogen.sh || true
          fi
          # Configure if configure exists
          if [ -f configure ]; then
            # tune configure flags as needed (enable SSE, etc.)
            ./configure CFLAGS="-O2 -march=native" LDFLAGS="" || true
          fi
          # If no configure but there is a top-level Makefile, nothing to do
          ls -la

      - name: Build
        run: |
          set -euo pipefail
          # Try common make targets; adjust if this project uses something else
          if make -j$(nproc); then
            echo "make OK"
          else
            # Try fallback: GNU make
            make -j2 || exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $BUILD_OUTPUT_DIR
          # Heuristics to find binaries; adjust names if this repo uses different binary names
          candidates="cpuminer minerd miner"
          for b in $candidates; do
            if [ -f "$b" ]; then
              cp "$b" "$BUILD_OUTPUT_DIR/" || true
            else
              # search for executables in top-level tree
              f=$(find . -maxdepth 2 -type f -perm /111 -iname "$b" -print -quit || true)
              if [ -n "$f" ]; then
                cp "$f" "$BUILD_OUTPUT_DIR/" || true
              fi
            fi
          done
          # If build put binaries in src/ or build/ adjust accordingly
          if [ -d src ]; then
            cp -a src/*.exe $BUILD_OUTPUT_DIR/ 2>/dev/null || true
            cp -a src/* $BUILD_OUTPUT_DIR/ 2>/dev/null || true
          fi
          # list artifacts
          ls -la $BUILD_OUTPUT_DIR || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpuminer-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ env.BUILD_OUTPUT_DIR }}

  fuzz:
    name: Fuzz (ASan + libFuzzer build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies for fuzz
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang libssl-dev libcurl4-openssl-dev libjansson-dev build-essential nasm
          # install python3 if harnesses use it
          sudo apt-get install -y python3 python3-pip
          # install afl++ if you plan to use AFL-based fuzzing (optional)
          sudo apt-get install -y afl++ || true

      - name: Configure ASan+libFuzzer build
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          export CC=clang
          export CXX=clang++
          # ASan-friendly options
          export CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-fsanitize=address,undefined"
          # If project has autogen/configure:
          if [ -f autogen.sh ]; then
            chmod +x autogen.sh
            ./autogen.sh || true
          fi
          if [ -f configure ]; then
            ./configure CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" || true
          fi
          make clean || true
          make -j$(nproc)

      - name: Build fuzz target (optional)
        # Assumes you add a fuzz target at fuzz/fuzz_target.c which exposes a harness using libFuzzer signature:
        #   extern "C" int LLVMFuzzerTestOneInput(const uint8_t *data, size_t size) { ... }
        run: |
          set -euo pipefail
          # If you maintain a fuzz/ directory with a target, try to compile it into a fuzz binary.
          if [ -d fuzz ]; then
            mkdir -p fuzz-build
            clang -g -O1 -fsanitize=fuzzer,address,undefined -I. fuzz/fuzz_target.c -o fuzz-build/fuzz_target $(ldflags 2>/dev/null || true) || true
            echo "fuzz target built"
          else
            echo "No fuzz/ dir found; skip building a fuzz target. Add fuzz/fuzz_target.c to enable."
          fi
          ls -la fuzz-build || true

      - name: Run a short fuzz session (if target present)
        run: |
          set -euo pipefail
          if [ -x fuzz-build/fuzz_target ]; then
            mkdir -p fuzz-corpus
            # seed corpus can be empty or you can add small sample inputs in repo
            echo "test" > fuzz-corpus/seed1
            # Run libFuzzer for a short duration (10s) to exercise harness; adjust as needed
            timeout 10s ./fuzz-build/fuzz_target fuzz-corpus || true
            # Save any artifacts/crashes
            mkdir -p $BUILD_OUTPUT_DIR
            cp -r fuzz-corpus $BUILD_OUTPUT_DIR/ || true
          else
            echo "No fuzz target executable found; skipping run."
          fi

      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpuminer-fuzz-artifacts
          path: |
            ${{ env.BUILD_OUTPUT_DIR }}
            fuzz-build || true

  # Optional: Add a job to run basic tests (if test suite exists)
  test:
    name: Test (optional)
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev
      - name: Run tests
        run: |
          # replace with whatever test command(s) this repo uses
          if make test; then
            echo "Tests passed"
          else
            echo "No test target or tests failed"
            exit 0
          fi
